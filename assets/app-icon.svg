<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 그라디언트 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 배경 -->
  <rect width="512" height="512" fill="url(#bg)" rx="120"/>
  
  <!-- 태양 -->
  <circle cx="256" cy="200" r="80" fill="url(#sun)"/>
  
  <!-- 태양 광선 -->
  <g stroke="#fff" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="100"/>
    <line x1="256" y1="300" x2="256" y2="320"/>
    <line x1="136" y1="200" x2="156" y2="200"/>
    <line x1="356" y1="200" x2="376" y2="200"/>
    <line x1="188" y1="132" x2="202" y2="146"/>
    <line x1="310" y1="254" x2="324" y2="268"/>
    <line x1="324" y1="132" x2="310" y2="146"/>
    <line x1="202" y1="254" x2="188" y2="268"/>
  </g>
  
  <!-- 알람 시계 -->
  <circle cx="256" cy="350" r="60" fill="#fff" stroke="#333" stroke-width="4"/>
  <circle cx="256" cy="350" r="50" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- 시계 바늘 -->
  <g stroke="#333" stroke-width="3" stroke-linecap="round">
    <line x1="256" y1="350" x2="256" y2="320"/>
    <line x1="256" y1="350" x2="276" y2="330"/>
  </g>
  
  <!-- 시계 숫자 -->
  <circle cx="256" cy="310" r="3" fill="#333"/>
  <circle cx="296" cy="350" r="3" fill="#333"/>
  <circle cx="256" cy="390" r="3" fill="#333"/>
  <circle cx="216" cy="350" r="3" fill="#333"/>
  
  <!-- 알람 벨 -->
  <g fill="#333">
    <ellipse cx="216" cy="320" rx="8" ry="12" transform="rotate(-30 216 320)"/>
    <ellipse cx="296" cy="320" rx="8" ry="12" transform="rotate(30 296 320)"/>
  </g>
</svg>
